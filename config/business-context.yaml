classification_guidance:
  # (ชื่อคีย์ ev_rule/tie_rule คงไว้ตามโครง Air4 — เนื้อหาปรับเป็นกฎของ SaleSync แล้ว)
  ev_rule: >-
    กฎ "ผลกระทบสองทาง" ของกฎเกณฑ์ข้อมูล/AI (PDPA, AI Act, data privacy):
    ห้ามตัดสินเป็น Positive หรือ Negative โดยอัตโนมัติ
    ด้านลบ = ต้นทุน compliance เพิ่ม และลูกค้าอาจกังวลการใช้ AI กับข้อมูลส่วนบุคคล
    ด้านบวก = SaleSync ที่ PDPA-compliant + KPI/Incentive โปร่งใส กลายเป็นจุดขาย
    และยกกำแพงกันคู่แข่งรายเล็กที่ทำ compliance ไม่ไหว
    ต้องประเมินผลกระทบสุทธิ (Net impact) ก่อนเลือกประเภทหลัก
  tie_rule: หากผลดีและผลเสียสมดุล หรือข้อมูลยังไม่พอ ให้จัดเป็น neutral
