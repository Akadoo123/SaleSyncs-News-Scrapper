# ============================================================
# Sources — ลำดับความสำคัญ: RSS/API ก่อน → Search → Scraping ท้ายสุด
# tier1 = แหล่งทางการ | tier2 = สำนักข่าว | tier3 = Social/ตลาด (ต้องติดป้าย "ยังไม่ยืนยัน")
#
# หมายเหตุ: ฟีดสาธารณะเปลี่ยน URL ได้ตลอด ระบบจึงทำ Source Health Check
# ตรวจได้ด้วย:  npx tsx scripts/check-feeds.ts
# ============================================================

defaults:
  max_items: 20
  timeout_ms: 15000

# ---------- 1) Google News RSS (Search-based, ไม่ต้องใช้ API Key) ----------
google_news:
  enabled: true
  endpoint: https://news.google.com/rss/search
  tier: 2
  locales:
    - { id: th-TH, hl: th,    gl: TH, ceid: "TH:th", country: TH, language: th }
    - { id: en-TH, hl: en-TH, gl: TH, ceid: "TH:en", country: TH, language: en }
    - { id: en-SG, hl: en-SG, gl: SG, ceid: "SG:en", country: SG, language: en }
    - { id: en-US, hl: en-US, gl: US, ceid: "US:en", country: GLOBAL, language: en }
    - { id: en-GB, hl: en-GB, gl: GB, ceid: "GB:en", country: GB, language: en }
  max_queries_per_locale: 16
  max_items_per_query: 12

# ---------- 2) Direct RSS feeds ----------
# ตรวจซ้ำได้ด้วย:  npx tsx scripts/check-feeds.ts
feeds:
  # ===== Tier 2 — เทคโนโลยี/สตาร์ทอัพ ไทย =====
  - id: blognone
    name: Blognone
    url: https://www.blognone.com/atom.xml
    tier: 2
    country: TH
    language: th
    enabled: true
  - id: techsauce
    name: Techsauce
    url: https://techsauce.co/feed
    tier: 2
    country: TH
    language: th
    enabled: true
  - id: prachachat
    name: ประชาชาติธุรกิจ
    url: https://www.prachachat.net/feed
    tier: 2
    country: TH
    language: th
    enabled: true
  - id: bangkokpost-tech
    name: Bangkok Post — Tech
    url: https://www.bangkokpost.com/rss/data/tech.xml
    tier: 2
    country: TH
    language: en
    enabled: true
  - id: bangkokpost-business
    name: Bangkok Post — Business
    url: https://www.bangkokpost.com/rss/data/business.xml
    tier: 2
    country: TH
    language: en
    enabled: true

  # ===== Tier 2 — สตาร์ทอัพ/เทค SEA =====
  - id: e27
    name: e27 (SEA Startup)
    url: https://e27.co/feed/
    tier: 2
    country: SG
    language: en
    enabled: false     # ตรวจ 2026-07-23: ฟีดใช้งานไม่ได้ (ยังครอบคลุมผ่าน Google News SG)
  - id: nikkei-asia
    name: Nikkei Asia
    url: https://asia.nikkei.com/rss/feed/nar
    tier: 2
    country: GLOBAL
    language: en
    enabled: true

  # ===== Tier 2 — เทค/SaaS/AI ต่างประเทศ =====
  - id: techcrunch
    name: TechCrunch
    url: https://techcrunch.com/feed/
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: theverge
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: venturebeat
    name: VentureBeat
    url: https://venturebeat.com/feed/
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: zdnet
    name: ZDNet
    url: https://www.zdnet.com/news/rss.xml
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: arstechnica
    name: Ars Technica
    url: http://feeds.arstechnica.com/arstechnica/index
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: saastr
    name: SaaStr
    url: https://www.saastr.com/feed/
    tier: 2
    country: GLOBAL
    language: en
    enabled: true
  - id: technologyreview
    name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    tier: 2
    country: GLOBAL
    language: en
    enabled: true

# ---------- แหล่งที่ตรวจแล้วใช้งานไม่ได้ (เก็บไว้เพื่อไม่ให้ลองซ้ำ) ----------
# ตรวจซ้ำเป็นระยะได้ด้วย: npx tsx scripts/check-feeds.ts <url>
disabled_feeds: []

# ---------- 3) Social listening ----------
# วิธีเข้าถึงแต่ละแพลตฟอร์มถูกกำหนดโดย robots.txt จริง (ดู src/collectors/social.ts)
social:
  enabled: true
  sources:
    # ---- Pantip: robots.txt อนุญาต (ห้ามเฉพาะ /ads.php) → ใช้งานได้ทันที ----
    # แท็กต้องมีอยู่จริงบน Pantip มิฉะนั้นจะได้ HTTP 404 (ระบบจะข้ามไปโดยไม่ล้ม)
    - id: pantip
      name: Pantip (ห้องเทคโนโลยี/ธุรกิจ)
      platform: pantip
      enabled: true
      max_items: 15
      # แท็กต้องมีอยู่จริงบน Pantip มิฉะนั้นจะได้ HTTP 404 (ระบบจะข้ามไปทีละแท็กโดยไม่ล้ม)
      tags:
        - ปัญญาประดิษฐ์
        - สตาร์ทอัพ
        - ธุรกิจ
        - การตลาด
        - ไอที
        - เทคโนโลยี
        - โปรแกรมเมอร์
        - ซอฟต์แวร์
        - SME
        - การขายออนไลน์
      searches: []

    # ---- Facebook: robots.txt = "Disallow: /" → ใช้ Graph API เท่านั้น ----
    - id: facebook-owned
      name: Facebook (เพจที่บริษัทดูแล)
      platform: facebook
      enabled: true
      max_items: 15
      pageIds: []          # ใส่ page id ที่นี่ เช่น ["123456789"]

    # ---- TikTok: ใช้ Display/Research API เท่านั้น (ตั้ง TIKTOK_ACCESS_TOKEN) ----
    - id: tiktok
      name: TikTok (แฮชแท็กที่ติดตาม)
      platform: tiktok
      enabled: true
      max_items: 15
      hashtags:
        - AI
        - SaaS

# ---------- 3.5) YouTube — ผ่าน Data API v3 (ทางการ) ----------
# โควตาฟรี 10,000 หน่วย/วัน ไม่ต้องผูกบัตร
# search = 100 หน่วย/คำค้น → 5 คำ = 500 หน่วย/วัน (ใช้ 5% ของโควตา)
# เปิดใช้โดยตั้งค่า YOUTUBE_API_KEY (Google Cloud Console → เปิด YouTube Data API v3)
youtube:
  enabled: true
  region: TH
  language: th
  lookback_days: 30          # ดึงคลิปที่ลงใน 30 วันล่าสุด
  max_results_per_query: 10
  # คำค้นสะท้อนความสนใจของตลาดต่อ CRM/AI/ซอฟต์แวร์การขาย (สัญญาณอุปสงค์)
  searches:
    - CRM สำหรับธุรกิจ
    - ระบบบริหารลูกค้า
    - AI ช่วยงานขาย
    - โปรแกรมบริหารทีมขาย
    - SaaS สำหรับ SME

# ---------- 4) Weather / Air quality — ปิดใช้งาน (ไม่เกี่ยวกับธุรกิจ SaaS) ----------
weather:
  enabled: false
  thresholds:
    heat_strong: 40
    heat_moderate: 36
    pm25_unhealthy: 50
    pm25_moderate: 37.5
    forecast_days: 7
  cities: []

# ---------- 5) News API (ใช้ต่อเมื่อมี NEWS_API_KEY เท่านั้น) ----------
newsapi:
  enabled_if_key: true
  endpoint: https://newsapi.org/v2/everything
  tier: 2
  page_size: 20
  max_queries: 8

# ---------- 6) Web scraping (ปิดเป็นค่าเริ่มต้น) ----------
scraping:
  enabled: false
  respect_robots_txt: true
  playwright_only_for: []
  notes: >-
    ใช้เฉพาะแหล่งที่ไม่มี RSS/API, ไม่ข้าม Paywall,
    เก็บเฉพาะ metadata + snippet สั้น ไม่เก็บบทความเต็ม

# ---------- นโยบายการดึงข้อมูล ----------
policy:
  per_domain_delay_ms: 1200
  max_retries: 2
  backoff_base_ms: 800
  respect_robots_txt: true
  store_full_article: false
  max_snippet_chars: 600
